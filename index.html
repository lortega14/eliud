<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Eliud Duque · Credian</title>
<meta name="description" content="Promotor Ejecutivo en Credian. Guarda mi contacto o escríbeme.">
<meta name="theme-color" content="#FFFFFF">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --fondo:  #FFFFFF;
    --tinta:  #101418;
    --azul:   #094C90;
    --azul-o: #073A6E;
    --verde:  #2AAF6D;
    --gris:   #5B6C7B;
    --linea:  rgba(16, 20, 24, 0.13);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .tarjeta {
    width: 100%;
    max-width: 30rem;
    padding: 2rem 1.75rem 3rem;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Encabezado ---------- */

  .encabezado {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .marca {
    height: 3.25rem;
    width: auto;
    flex: 0 0 auto;
    align-self: flex-start;
    object-fit: contain;
    display: block;
    margin: 0 auto 2rem 0;
  }

  .retrato {
    width: 10rem;
    height: 10rem;
    flex: 0 0 auto;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px var(--linea);
    object-fit: cover;
    background: #E8EDF1;
    display: block;
    margin-bottom: 1.5rem;
  }

  /* ---------- Nombre ---------- */

  h1 {
    margin: 0;
    font-size: clamp(2.5rem, 12vw, 3.5rem);
    font-weight: 800;
    line-height: 0.94;
    letter-spacing: -0.035em;
  }

  .puesto {
    margin: 1.125rem 0 0;
    font-size: 1.0625rem;
    font-weight: 700;
    color: var(--azul);
    letter-spacing: -0.01em;
  }

  .lugar {
    margin: 0.375rem 0 0;
    font-size: 0.9375rem;
    font-weight: 500;
    color: var(--gris);
    max-width: 24rem;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---------- Acción principal ---------- */

  .guardar {
    display: block;
    margin: 1.75rem 0 2.5rem;
    padding: 1.125rem 1.25rem;
    border-radius: 0.75rem;
    background: var(--azul);
    color: #FFFFFF;
    font-size: 1.0625rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-align: center;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  .guardar:active { background: var(--azul-o); }

  /* ---------- Canales ---------- */

  .canales { border-top: 2px solid var(--verde); }

  .canal {
    display: block;
    padding: 1.125rem 0;
    border-bottom: 1px solid var(--linea);
    text-decoration: none;
    color: inherit;
  }

  .canal:active { background: #F1F5F8; }

  .canal dt {
    font-size: 1.0625rem;
    font-weight: 700;
    letter-spacing: -0.015em;
  }

  .canal dd {
    margin: 0.1875rem 0 0;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--gris);
    word-break: break-word;
  }

  dl { margin: 0; }

  /* ---------- Marcas del grupo ---------- */

  .marcas {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 1.75rem;
    padding: 1.25rem 0;
    border-top: 1px solid var(--linea);
    border-bottom: 1px solid var(--linea);
  }

  .marcas figure {
    margin: 0;
    flex: 1 1 0;
    text-align: center;
  }

  .marcas img {
    height: 2.5rem;
    width: 100%;
    object-fit: contain;
    display: block;
  }

  .marcas figcaption {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--gris);
  }

  /* ---------- Redes de la empresa ---------- */

  .redes-titulo {
    margin: 2rem 0 0.875rem;
    text-align: center;
    font-size: 0.8125rem;
    font-weight: 700;
    color: var(--gris);
    letter-spacing: 0.01em;
  }

  .redes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.625rem;
  }

  .red {
    width: 2.875rem;
    height: 2.875rem;
    border-radius: 50%;
    background: #EEF2F6;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  .red svg {
    width: 1.25rem;
    height: 1.25rem;
    color: var(--azul);
    fill: currentColor;
  }

  .red:active { background: #DCE5EC; }

  .oculto { display: none; }

  /* ---------- Accesibilidad ---------- */

  a:focus-visible {
    outline: 2px solid var(--azul);
    outline-offset: 3px;
    border-radius: 0.25rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
